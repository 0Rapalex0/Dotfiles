exec-once = swaybg -i /home/jazzajf/Descargas/hifi.png -m fill
exec-once = quickshell --path ~/.config/quickshell/shell.qml
exec-once = hypridle

input {
    kb_layout = es
    # Si prefieres el teclado latinoamericano, usa:
    # kb_layout = latam 
    
    follow_mouse = 1
    # ... resto de tu configuración ...
}

# --- Monitores ---
monitor=eDP-1, 1920x1080@60, 0x0, 1

# --- Variables Principales ---
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun
$browser = floorp

# --- Estética General ---
general {
    gaps_in = 2
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(bb9af7)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# --- Decoración ---
decoration {
    rounding = 12
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- Animaciones ---
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Atajos de Teclado ---

# Aplicaciones
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, R, exec, wofi --show drun --allow-images --width=400 --height=350 --prompt "Buscar..."
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, flatpak run one.ablaze.floorp
bind = $mainMod, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png
bind = $mainMod SHIFT, S, exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy

# Gestión de Ventanas
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, E, exit,

# Movimiento de Foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Navegación de Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Mover Ventanas a Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

misc {
    force_default_wallpaper = 0
}
